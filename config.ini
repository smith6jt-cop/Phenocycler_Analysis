# Portable defaults for the manifest-driven Phenocycler workflow.
#
# Raw QuPath CSV, qptiff and geometry paths are declared once in
# data/qupath_manifest.json.

[paths]
data_dir = data
qupath_manifest = data/qupath_manifest.json
marker_registry = phenocycler/marker_registry.json
typing_rules = phenocycler/typing_rules.json

[cells]
min_cell_area = 5.0

[geometry_qc]
min_cell_area = 20.0
max_area_median_multiple = 4.0
min_cell_solidity = 0.70
min_raster_area_ratio = 0.50
max_raster_area_ratio = 2.00
no_cytoplasm_nc_ratio = 0.999
duplicate_radius_um = 1.0
duplicate_area_tol = 0.15
# Batch-2 islet detections contain known duplicate cell geometries. Retain one
# QC-viable nucleus-bearing detection per group and exclude every duplicate
# copy from analysis, estimation, and physical spillover context.
duplicate_policy = deterministic_keep
# InstanSeg cell fragments without a nucleus fail every cell-level QC role,
# including physical spillover context.
missing_geometry_policy = exclude

[redsea]
downsample = 1.0
edge_radius = 0
comp_mode = 1
alpha = 1.0
gap_bridge = 1
norm_form = donor
exclude_no_spillover = true

[compute]
n_jobs = 4
duckdb_threads = 18
use_gpu = false
gpu_device = 0
# Resource-aware donor pipeline: at most four total tasks, including no more
# than two memory-heavy geometry rasters, one REDSEA donor, and four lightweight
# downstream donors. GPU REDSEA is always serialized to one task per device.
geometry_workers = 2
redsea_workers = 1
downstream_workers = 4

[metadata]
donor_col = donor_id
status_col = disease.status

# --------------------------------------------------------------------------- #
# Everything below is read ONLY by phenocycler/integration/ (the PhenoCycler <->
# Xenium layer). The eight-stage core pipeline above never reads it.
# --------------------------------------------------------------------------- #

[lineage]
# Thresholds the integration layer still applies when it derives endocrine
# subtype and seeds islet DBSCAN from hormone-positive cells. They describe the
# legacy RESTORE _norm scale, which the core pipeline on this branch no longer
# produces — see docs/INTEGRATION.md for the status of repointing that layer at
# this branch's marker_evidence/ output.
hormone_min_norm = 5
cd99_bright = 3

[integration]
# PhenoCycler <-> Xenium integration (phenocycler/integration/). Steps 1-7 of the core
# pipeline never read this section, so `python -m phenocycler.pipeline` is unaffected and
# still runs in the lean environment.
#
# sequential = serial sections from one block (cells are NOT the same cells; pairing is
#              structure/niche/donor level). same_slide = one physical section imaged twice
#              (true cell-to-cell pairing). The mode is a hard guard, not a hint.
mode = sequential

# Donor -> Xenium run manifest (donor_id, roi, batch, source_path). Vendored from
# Xenium_Analysis, where it is a hand-maintained file that no code reads.
xenium_paths_csv = data/integration/xenium_paths.csv
# donor_id for Xenium samples that xenium_paths.csv does not cover (e.g. 0041323/0041326,
# which have processed h5ads but no recorded donor). Columns: xenium_sample_key, donor_id, roi.
donor_overrides_csv = data/integration/donor_overrides.csv
# Optional prefix rewrite when the bundles are mounted somewhere other than the path
# recorded in xenium_paths.csv, e.g. /orange/brusko/xenium -> /mnt/xenium.
xenium_root =
# XeniumPanelExplorer checkout (git submodule). Supplies panel_roles.csv + identity_core/*,
# which the upstream repo ships specifically as a machine-readable contract for Python.
panel_explorer = external/XeniumPanelExplorer

# --- Tissue -----------------------------------------------------------------
# The cohort is 20 donors x {PhenoCycler, Xenium} x {pancreas, pancreatic lymph node}.
# Tissue is a property of the DATASET, fixed when it is imported, and rides through the cell
# table as a column — so every stage runs on one tissue or on both, selected with --tissue,
# rather than tissue being a global mode you have to remember to flip.
#
# The two tissues diverge in exactly two places, both biological:
#   * structures — a lymph node has no islets, so the structure level (S3) and islet matching
#     (S6) do not run for it. Registration, niches, the grid, donor composition and
#     pseudo-cell linking all still do.
#   * identity panels — XeniumPanelExplorer ships pancreas and thymus, no lymph node, and the
#     cores a lymph node needs are exactly the shared immune/vascular/stromal/neural ones. So
#     pLN resolves to the shared pool and the three pancreas-specific cores are excluded.
# See phenocycler/integration/tissues.py, which is the single place that knows the difference.
#
# Default tissue for a dataset that declares none (also picks the
# external/XeniumPanelExplorer/data/tissues/<tissue>/ directory).
tissue = pancreas
# The cohort's tissues. A bare pipeline run covers all of them; --tissue narrows it.
tissues = pancreas,pancreatic_lymph_node
# OPTIONAL override, as `tissue=/path,tissue=/path`. You almost certainly do not need this.
#
# One core-pipeline run covers both tissues: partitions are keyed by SECTION, not donor, so
# 6539_Scan1.er.qptiff -> donor_id=6539 and 6539pLN_Scan1.er.qptiff -> donor_id=6539pln
# (phenocycler/sections.py). Set this only when a tissue came from a SEPARATE core-pipeline
# run — a different QuPath export, hence a different data dir. Left empty, every tissue is
# read from data_dir, which is correct for the normal case.
pheno_tissue_dirs =

# Registration. The FIXED frame is the one everything is warped into.
fixed_modality = phenocycler
reg_pixel_um = 2.0        # raster resolution for mask/image registration
reg_nonrigid = true       # B-spline stage after rigid+affine
reg_max_disp_um = 200     # displacement cap; prevents the non-rigid stage folding tissue

# Islet calling. Identical on both modalities so the structures are comparable; the values
# are Xenium_Analysis/scripts/insulitis_analysis.py EPS_UM / MIN_SAMPLES. Seeds are
# hormone-POSITIVE cells, not lineage labels (label seeding finds ~2-9 islets vs 112+).
# The PhenoCycler seed threshold is [lineage] hormone_min_norm, already 5.
islet_eps_um = 50
islet_min_samples = 10

# Niches: mirrors Xenium_Analysis nb03 cell 12 (kNN composition -> KMeans -> majority
# smoothing) so the two modalities' niche vocabularies are directly comparable.
niche_k = 50
niche_n = 12
niche_smooth_k = 30
# Registered-frame hex grid (the registration-dependent second view).
grid_um = 100

# Islet <-> islet matching gates.
match_max_dist_um = 200
match_area_ratio = 2.5

# Post-Xenium re-stain (S1c). The Xenium section is re-stained for INS/GCG on the PhenoCycler
# afterwards, which is the one place in this cohort where protein and RNA measure the SAME
# cell. Those qptiffs flow through the CORE pipeline like any other, so they need a section
# token that phenocycler/sections.py recognises (`xen`, `xpanc`, `xenpln`, `xpln` — e.g.
# 6539xen_Scan1.er.qptiff); an unrecognised token is refused rather than guessed at.
#
# Set this to true ONLY once postxen has actually stamped endocrine_subtype onto the Xenium
# table. It upgrades Xenium Endocrine in the vocabulary crosswalk from `surrogate` (called
# from PDX1/ISL1/NEUROD1/ABCC8, because INS/GCG/SST are off the 5K panel) to `yes` — i.e. it
# asserts a hormone-protein measurement, so setting it early claims data you do not have.
xenium_hormone_if = false

# Pseudo-cell linking refuses to run below this many verified protein<->gene anchors.
# INS/GCG/SST/Vimentin are off the Xenium panel, so the usable set is thinner than the
# 46 nominal 1:1 pairs and must not be allowed to silently collapse to a handful.
crossmodal_min_anchors = 8

# Registration QC gates. FAIL donors are excluded from structure/niche/pseudo-cell
# analyses but still contribute to the registration-free donor-level comparison.
qc_tissue_dice_min = 0.80
qc_islet_rmse_max_um = 150
