# Portable defaults for the manifest-driven Phenocycler workflow.
#
# Raw QuPath CSV, qptiff and geometry paths are declared once in
# data/qupath_manifest.json.

[paths]
data_dir = data
qupath_manifest = data/qupath_manifest.json
marker_registry = phenocycler/marker_registry.json
typing_rules = phenocycler/typing_rules.json

[cells]
min_cell_area = 5.0

[geometry_qc]
min_cell_area = 20.0
max_area_median_multiple = 4.0
min_cell_solidity = 0.70
min_raster_area_ratio = 0.50
max_raster_area_ratio = 2.00
no_cytoplasm_nc_ratio = 0.999
duplicate_radius_um = 1.0
duplicate_area_tol = 0.15

[redsea]
downsample = 1.0
edge_radius = 0
comp_mode = 1
alpha = 1.0
gap_bridge = 1
norm_form = donor
exclude_no_spillover = true

[compute]
n_jobs = 1
duckdb_threads = 8
use_gpu = false
gpu_device = 0
