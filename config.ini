# Phenocycler_Analysis — pipeline configuration
#
# Values here override the built-in defaults in phenocycler/config.py. Every path
# and compute knob the pipeline uses lives in this file (no hardcoded absolute
# paths in the code). Environment variables (PHENOCYCLER_DATA_DIR, _IMAGES_DIR,
# _CELLS_CSV, _DONOR_METADATA, _JOBS, _USE_GPU) override these.
#
# The scientific defaults (REDSEA subtract-only/alpha=1/1-px band, RESTORE SSC + robust guard, the
# curated directional marker pairs, the 5-compartment ordered-residual partition) are baked into
# phenocycler/config.py and should not usually change — this file is for paths and performance.
#
# Cohort eligibility is fail-closed in phenocycler/cohort.py. Donor 6457 is
# excluded because poor DAPI staining prevented accurate channel registration;
# donor 6579 is excluded by maintainer decision as a pancreatitis outlier. These
# are intentionally not tunable config overrides.

[paths]
# Root for all pipeline outputs (hive-partitioned donor_id=* layout). Not tracked.
data_dir = data
# Directory of raw multichannel .qptiff images (REDSEA reads these one channel at a
# time). Machine-specific — set to your image folder.
images_dir = data/raw/images
# The full QuPath per-cell export (Cellmeasurements.csv). Machine-specific.
cells_csv = data/raw/Cellmeasurements.csv
# Donor metadata workbook with the disease-status column. Machine-specific.
donor_metadata = data/raw/donor_metadata_panc.xlsx
# Vendored RESTORE python package (git submodule at external/RESTORE).
restore_vendor = external/RESTORE/python_code

[metadata]
donor_col = donor_id
status_col = disease.status

[redsea]
# Faithful Islet-Explorer-Senior defaults. downsample must be a power of 2.
downsample = 1.0
edge_radius = 0        # 0 = the 1-px cell rim (a thin band is essential for small cells)
comp_mode = 1          # 1 = subtract+reinforce (Bai et al. default, restored in METHOD v10); 0 = subtract-only
alpha = 1.0            # spillover subtraction strength
gap_bridge = 1         # bridge background gaps <= N px when building the contact graph
norm_form = donor      # donor = contact[i,j]/B[j] (published, mass-conserving); recipient = pre-v10
exclude_no_spillover = true   # pass nuclear/ECM channels through uncorrected (marker_taxonomy.NO_SPILLOVER)

[restore]
model = SSC            # gating model: SSC (default) | GMM | KMeans
subsample = 15000      # post-idx_select cloud cap fed to clustering per image x pair
robust = true          # impute degenerate per-image thresholds with the cohort median
robust_factor = 3.0    # outlier if > factor x or < 1/factor x the cohort median
min_cell_area = 5.0    # drop QuPath segmentation debris below this Cell:Area um^2
seed = 0

[compute]
# Per-donor process-pool size for REDSEA / RESTORE-apply / lineage. Each donor is
# independent, so this scales near-linearly. 1 = serial; 0 = all CPUs.
n_jobs = 1
# DuckDB threads for the cells-parquet build (out-of-core CSV -> parquet).
duckdb_threads = 8
# Opt-in CuPy backend for REDSEA (bincount + sparse F@edge). Requires cupy + CUDA.
# Use with n_jobs=1 (one donor on the device); use a SLURM array for GPU cohorts.
use_gpu = true
gpu_device = 0

[cell_qc]
# Single-cell QC applied BEFORE any parameter estimation (phenocycler.cell_qc). Every value is
# donor-local or scale-free, so none of them normalises across donors.
# Tier 1 - hard exclusion: the object is not a cell, removed from the canonical set.
min_cell_area = 20.0             # um^2. A 5 um disc, still below a lymphocyte (~7 um, ~38 um^2).
                                 # Below this, DAPI is 0.67-0.88x normal in EVERY donor.
require_nucleus = true           # DNA gate. No-nucleus objects carry 0.26-0.41x normal DAPI.
max_area_median_multiple = 4.0   # x the donor's OWN median retained area (lands at 180-302 um^2).
                                 # Above this: E-cadherin 0.39x, Pan-CK 0.29x, Vimentin 3.85x.
min_cell_solidity = 0.70         # area/convex-hull. Circularity is NOT used - it is compartment-
                                 # biased here (removes real elongated stroma: Vimentin 4.6x).
min_raster_area_ratio = 0.5      # rasterized vs reported area; catches the 6450/6523 geometry defect
# Tier 2 - excluded from ESTIMATION only; these cells are real and still get a call.
no_cytoplasm_nc_ratio = 0.999
# Duplicate removal. Detection ran with selectAnnotations(), selecting Tissue AND every nested
# Islet_N; InstanSeg segments each selected parent independently and does not deduplicate across
# parents, so islet nuclei were segmented twice (8/20 donors, 100% of duplicates inside islets).
deduplicate = true
duplicate_radius_um = 1.0        # centroid separation below which two objects are the same cell
duplicate_area_tol = 0.15        # and their areas must agree to within this fraction    # nucleus_area == cell_area -> a membrane marker's "whole-cell
                                 # mean" is a nuclear mean, so it must not set a threshold.
