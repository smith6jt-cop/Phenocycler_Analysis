# Phenocycler_Analysis — pipeline configuration
#
# Values here override the built-in defaults in phenocycler/config.py. Every path
# and compute knob the pipeline uses lives in this file (no hardcoded absolute
# paths in the code). Environment variables (PHENOCYCLER_DATA_DIR, _IMAGES_DIR,
# _CELLS_CSV, _DONOR_METADATA, _JOBS, _USE_GPU) override these.
#
# The scientific defaults (REDSEA subtract-only/alpha=1/1-px band, RESTORE SSC + robust guard, the
# curated directional marker pairs, the 5-compartment ordered-residual partition) are baked into
# phenocycler/config.py and should not usually change — this file is for paths and performance.

[paths]
# Root for all pipeline outputs (hive-partitioned donor_id=* layout). Not tracked.
data_dir = data
# Directory of raw multichannel .qptiff images (REDSEA reads these one channel at a
# time). Machine-specific — set to your image folder.
images_dir = data/raw/images
# The full QuPath per-cell export (Cellmeasurements.csv). Machine-specific.
cells_csv = data/raw/Cellmeasurements.csv
# Donor metadata workbook with the disease-status column. Machine-specific.
donor_metadata = data/raw/donor_metadata_panc.xlsx
# Vendored RESTORE python package (git submodule at external/RESTORE).
restore_vendor = external/RESTORE/python_code

[metadata]
donor_col = donor_id
status_col = disease.status

[redsea]
# Faithful Islet-Explorer-Senior defaults. downsample must be a power of 2.
downsample = 1.0
edge_radius = 0        # 0 = the 1-px cell rim (a thin band is essential for small cells)
comp_mode = 0          # 0 = subtract-only (1 = subtract+reinforce)
alpha = 1.0            # spillover subtraction strength
gap_bridge = 1         # bridge background gaps <= N px when building the contact graph

[restore]
model = SSC            # gating model: SSC (default) | GMM | KMeans
subsample = 15000      # post-idx_select cloud cap fed to clustering per image x pair
robust = true          # impute degenerate per-image thresholds with the cohort median
robust_factor = 3.0    # outlier if > factor x or < 1/factor x the cohort median
min_cell_area = 5.0    # drop QuPath segmentation debris below this Cell:Area um^2
seed = 0

[compute]
# Per-donor process-pool size for REDSEA / RESTORE-apply / lineage. Each donor is
# independent, so this scales near-linearly. 1 = serial; 0 = all CPUs.
n_jobs = 1
# DuckDB threads for the cells-parquet build (out-of-core CSV -> parquet).
duckdb_threads = 8
# Opt-in CuPy backend for REDSEA (bincount + sparse F@edge). Requires cupy + CUDA.
# Use with n_jobs=1 (one donor on the device); use a SLURM array for GPU cohorts.
use_gpu = true
gpu_device = 0
