[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phenocycler-analysis"
version = "1.0.0"
description = "Manifest-driven Phenocycler expression calibration and hierarchical cell typing"
readme = "README.md"
requires-python = ">=3.10"
# Runtime bounds remain unpinned here so editable installs can share an existing
# scientific Python environment.  The reproducible conda reference versions
# live in environment.yml.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "scikit-image",
    "statsmodels",
    "tifffile",
    "imagecodecs",
    "duckdb",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
test = ["pytest"]
notebook = ["jupyterlab", "ipykernel", "ipywidgets"]

[project.scripts]
phenocycler = "phenocycler.pipeline:main"

[tool.setuptools]
packages = ["phenocycler"]
include-package-data = true

[tool.setuptools.package-data]
phenocycler = ["marker_registry.json", "typing_rules.json"]
